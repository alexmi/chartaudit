[project]
name = "chartaudit"
version = "0.1.0"
description = "Hindsight-free scoring for the lines traders draw on charts."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pydantic>=2",
    "openai>=2,<3",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
demo = ["gradio==6.28.0", "pillow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
